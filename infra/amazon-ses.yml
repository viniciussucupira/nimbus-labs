AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Marktmorgen: everything Amazon needs so the site can send its email through
  Amazon SES (lib/ses.ts) and hear about bounces and spam reports
  (app/api/mail/ses). One stack, made once, in the region email is sent from.

# What this makes, and why each part is there:
#
#   VercelOidc     Tells Amazon to believe the short-lived token the host
#                  (Vercel) gives each request of this team's projects.
#   SendRole       The one thing that token may be exchanged for: a role
#                  that can send email from this domain, read the account's
#                  own limits, and nothing else. Only the production
#                  deployment of the one project may take it. No key of
#                  Amazon's is stored anywhere because of this.
#   Domain         Proves to Amazon that the domain is ours. Its three DKIM
#                  records (the stack's outputs) go into the domain's DNS.
#                  The site's own email is sent from it: login links,
#                  receipts, files, notices.
#   CreatorsDomain The domain creators' email to people is sent from
#                  (lib/mail-from.ts, MARKETING_FROM_DOMAIN), proved apart
#                  and signed with a key of its own, so that what inboxes
#                  come to think of one creator's newsletter is not held
#                  against the domain a login link comes from. Its three
#                  DKIM records are outputs too.
#
#   Both domains also name the address a bounce comes back to (MAIL FROM)
#   as one of their own, so that SPF passes for the domain a reader sees
#   and not only for Amazon's. Each needs two records in the DNS, which are
#   the same two Resend asks for and so are already there for a domain
#   Resend sends from:
#
#     send.<domain>   MX    10 feedback-smtp.<region>.amazonses.com
#     send.<domain>   TXT   v=spf1 include:amazonses.com ~all
#
#   Until they are there Amazon uses its own address instead, and nothing
#   stops.
#   Events         The configuration set every email is sent under. It is
#                  what makes Amazon tell us what became of an email.
#   Topic          Where Amazon announces a bounce or a spam report.
#   ToTheSite      Posts each announcement to the site.
#
# What it cannot do, because Amazon has no resource for it: ask Amazon to
# let the account write to the public ("production access"). That is a form
# in the Amazon SES console, under Account dashboard.
#
# Before the stack is made, the site must already have its four settings and
# be deployed with them, because the moment ToTheSite is made Amazon posts a
# question to the site (do you want this topic's announcements?) and the
# site answers only for the topic it has been told is its own. The values
# are known before the stack exists, from the account's 12-digit number:
#
#   AWS_SES_ROLE_ARN            arn:aws:iam::<account>:role/marktmorgen-email
#   AWS_SES_REGION              the region this stack is made in
#   AWS_SES_CONFIGURATION_SET   marktmorgen
#   AWS_SES_TOPIC_ARN           arn:aws:sns:<region>:<account>:marktmorgen-email

Parameters:
  DomainName:
    Type: String
    Default: marktmorgen.com
    Description: The domain email is sent from.
  CreatorsDomainName:
    Type: String
    Default: mail.marktmorgen.com
    Description: The domain creators' email is sent from. The value of MARKETING_FROM_DOMAIN.
  SiteEndpoint:
    Type: String
    Default: https://marktmorgen.com/api/mail/ses
    Description: Where Amazon posts bounces and spam reports.
    AllowedPattern: "^https://.+"

Resources:
  VercelOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://oidc.vercel.com/viniciussucupira
      ClientIdList:
        - https://vercel.com/viniciussucupira

  SendRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: marktmorgen-email
      Description: Taken by the Marktmorgen site, in production only, to send email through Amazon SES.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref VercelOidc
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "oidc.vercel.com/viniciussucupira:aud": https://vercel.com/viniciussucupira
                "oidc.vercel.com/viniciussucupira:sub": owner:viniciussucupira:project:nimbus-labs:environment:production
      Policies:
        - PolicyName: send-email-and-read-limits
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SendFromTheDomainUnderTheSet
                Effect: Allow
                Action: ses:SendEmail
                Resource:
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${DomainName}
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${CreatorsDomainName}
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${Events}
              - Sid: ReadWhatTheAccountMayDo
                Effect: Allow
                Action: ses:GetAccount
                Resource: "*"

  Events:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: marktmorgen
      ReputationOptions:
        ReputationMetricsEnabled: true
      SendingOptions:
        SendingEnabled: true
      SuppressionOptions:
        SuppressedReasons:
          - BOUNCE
          - COMPLAINT

  Domain:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName
      DkimAttributes:
        SigningEnabled: true
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref Events
      MailFromAttributes:
        MailFromDomain: !Sub send.${DomainName}
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  CreatorsDomain:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref CreatorsDomainName
      DkimAttributes:
        SigningEnabled: true
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref Events
      MailFromAttributes:
        MailFromDomain: !Sub send.${CreatorsDomainName}
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  Topic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: marktmorgen-email
      SignatureVersion: "2"

  TopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref Topic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyThisAccountsEmailServiceMayPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref Topic
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId

  EventsToTopic:
    Type: AWS::SES::ConfigurationSetEventDestination
    DependsOn: TopicPolicy
    Properties:
      ConfigurationSetName: !Ref Events
      EventDestination:
        Name: bounces-and-complaints
        Enabled: true
        MatchingEventTypes:
          - bounce
          - complaint
        SnsDestination:
          TopicARN: !Ref Topic

  ToTheSite:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Topic
      Protocol: https
      Endpoint: !Ref SiteEndpoint

Outputs:
  RoleArn:
    Description: The value of AWS_SES_ROLE_ARN.
    Value: !GetAtt SendRole.Arn
  TopicArn:
    Description: The value of AWS_SES_TOPIC_ARN.
    Value: !Ref Topic
  ConfigurationSet:
    Description: The value of AWS_SES_CONFIGURATION_SET.
    Value: !Ref Events
  DkimRecord1:
    Description: A CNAME record for the domain's DNS, as "name -> value".
    Value: !Sub "${Domain.DkimDNSTokenName1} -> ${Domain.DkimDNSTokenValue1}"
  DkimRecord2:
    Description: A CNAME record for the domain's DNS, as "name -> value".
    Value: !Sub "${Domain.DkimDNSTokenName2} -> ${Domain.DkimDNSTokenValue2}"
  DkimRecord3:
    Description: A CNAME record for the domain's DNS, as "name -> value".
    Value: !Sub "${Domain.DkimDNSTokenName3} -> ${Domain.DkimDNSTokenValue3}"
  CreatorsDkimRecord1:
    Description: A CNAME record for the DNS of the domain creators write from, as "name -> value".
    Value: !Sub "${CreatorsDomain.DkimDNSTokenName1} -> ${CreatorsDomain.DkimDNSTokenValue1}"
  CreatorsDkimRecord2:
    Description: A CNAME record for the DNS of the domain creators write from, as "name -> value".
    Value: !Sub "${CreatorsDomain.DkimDNSTokenName2} -> ${CreatorsDomain.DkimDNSTokenValue2}"
  CreatorsDkimRecord3:
    Description: A CNAME record for the DNS of the domain creators write from, as "name -> value".
    Value: !Sub "${CreatorsDomain.DkimDNSTokenName3} -> ${CreatorsDomain.DkimDNSTokenValue3}"
